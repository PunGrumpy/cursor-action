name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        name: Install Bun
      - uses: actions/cache@v5
        name: Setup Bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun run test
      - name: Build dist
        run: bun run build
      - name: Verify dist is up-to-date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'bun run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi

  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      CURSOR_SMOKE_TEST_MODEL: default
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run cursor-action (smoke test)
        id: cursor
        uses: ./
        with:
          api-key: ${{ secrets.CURSOR_API_KEY }}
          prompt: "Say 'smoke test passed' and nothing else."
          model: ${{ env.CURSOR_SMOKE_TEST_MODEL }}
          # Run outside the checkout so this repo's own .cursor/ config and
          # hooks cannot influence the headless run.
          working-directory: ${{ runner.temp }}
          permissions: "read-only"
          timeout: "60"
      - name: Assert output is non-empty
        shell: bash
        # Passed through env, never interpolated into the script: the summary is
        # model output and would otherwise be executed as shell.
        env:
          SUMMARY: ${{ steps.cursor.outputs.summary }}
        run: |
          if [ -z "$SUMMARY" ]; then
            echo "::error::cursor-action returned an empty summary"
            exit 1
          fi
          echo "Smoke test passed. Summary: $SUMMARY"
